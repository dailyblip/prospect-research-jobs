name: Sync jobs and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prospect-research-jobs-pages
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync approved jobs
        env:
          JOBS_FEED_URL: https://script.google.com/macros/s/AKfycby1kXoxY6QBFhOPBEzn3vXmqfcrTBTNqBRNjlTWWN17fqqJPmqtQn6t6VfGTEAYM4hcYw/exec?format=json
        run: node scripts/sync-jobs.mjs

      - name: Test and build
        run: |
          node --test
          node scripts/validate-site.mjs
          node scripts/build-site.mjs

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/jobs.json; then
            exit 0
          fi
          git config user.name "prospect-research-jobs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git commit -m "chore: refresh approved jobs"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: sync-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
